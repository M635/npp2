[package]
name = "npp2"
version = "1.0.0"
description = "Notepad++ 跨平台复刻"
authors = ["NPP2"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "npp2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-clipboard-manager = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
encoding_rs = "0.8"
chardetng = "=0.1.17"
notify = "6"
memmap2 = "0.9"
rayon = "1.10"
regex = "1.11"
walkdir = "2.5"
anyhow = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
